minimum_pre_commit_version: "3.6.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'gofmt -w "$@"' --
        language: system
        files: \.go$

      - id: go-vet
        name: go vet
        entry: bash -c 'root="$(pwd)"; mkdir -p "$root/.cache/go-build" "$root/.cache/gomod" && GOCACHE="$root/.cache/go-build" GOMODCACHE="$root/.cache/gomod" go vet ./...'
        language: system
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'root="$(pwd)"; mkdir -p "$root/.cache/go-build" "$root/.cache/gomod" "$root/.cache/golangci-lint" && GOCACHE="$root/.cache/go-build" GOMODCACHE="$root/.cache/gomod" GOLANGCI_LINT_CACHE="$root/.cache/golangci-lint" golangci-lint run --timeout=5m'
        language: system
        pass_filenames: false
